<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./css/style.css" />
  <title>Music Player</title>
</head>

<body>
  <main class="container">
    <h1 class="heading">Featurastic Music Player</h1>
    <div id="loading" class="loading">Loading tracks...</div>
    <div id="error" class="error" style="display:none;"></div>
    <div id="music-player" style="display:none;">
      <div class="music-container">
        <div id="cover-box">
          <img id="cover" src="" alt="Album cover" />
        </div>
        <div id="music-info">
          <div id="title"></div>
          <div id="artist"></div>
        </div>
        <div id="progress-container">
          <div id="progress"></div>
        </div>
        <div id="timer-bar">
          <span id="current-time">0:00</span>
          <span id="duration">0:00</span>
        </div>
        <div id="control-box">
          <button class="btn" id="prev"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M6 18V6h2v12zm3.5-6L18 18V6z"></path></svg></button>
          <button class="btn" id="play"><svg id="play-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M8 5v14l11-7z"></path></svg></button>
          <button class="btn" id="next"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M16 6v12h-2V6zm-3.5 6L6 6v12z"></path></svg></button>
        </div>
        <audio id="audio"></audio>
      </div>
    </div>
  </main>
  <script src="js/main.js"></script>
</body>

</html>
